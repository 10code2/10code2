name: Generate Profile Images

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）运行
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ---- 蛇形贡献图 ----
      - name: Generate GitHub Contributions Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # ---- 统计卡片 ----
      # 说明：统计总 commits 需调用 Search API，GITHUB_TOKEN（集成令牌）会被拒绝，
      # 因此需要一个用户级 PAT（classic，不勾选任何 scope 即可），存为 secret PAT_STATS。
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.PAT_STATS }}

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_STATS }}

      # ---- 部署到 output 分支 ----
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
